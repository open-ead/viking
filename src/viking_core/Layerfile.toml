[crate]

[layer.pyapi]
depends-on = [
    "cli",
    "fl",
    "demangle",
    "git",
    "ui",
    "python",
    "config",
    "pyinterop"
]

[layer.cli]
depends-on = [
    "cmd_check",
    "cmd_decompme",
    "cmd_listsym",
    "cmd_progress",
    "config"
]

[layer.cmd_check]
depends-on = ["config", "fl", "demangle", "elf", "ui", "python"]

[layer.cmd_decompme]
depends-on = ["config", "fl", "demangle", "elf", "ui"]

[layer.cmd_listsym]
depends-on = ["config", "fl", "demangle", "elf"]

[layer.cmd_progress]
depends-on = ["config", "fl", "demangle", "ui", "git"]

[layer.elf]
depends-on = ["config", "fl", "demangle", "ui"]

[layer.fl]
depends-on = ["config", "pyinterop", "python", "ui", "demangle"]

[layer.python]
depends-on = ["config", "pyinterop"]
impl = ["pyinterop"]

[layer.git]
depends-on = ["config", "ui"]

[layer.config]
depends-on = ["pyinterop"]

[layer.ui]
depends-on = ["pyinterop", "demangle"]

[layer.demangle]
depends-on = ["pyinterop"]

[layer.pyinterop]
