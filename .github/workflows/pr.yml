name: pr
on:
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: Pistonight/mono-dev/actions/setup@main
        with:
          mono-dev: false
          rust: stable
          python: uv
      - run: task install
      - run: task check-main
      - run: task test

  check-layers:
    runs-on: ubuntu-latest
    steps:
      - uses: Pistonight/mono-dev/actions/setup@main
        with:
          mono-dev: false
          rust: stable
          python: uv
          tool-cargo-binstall: layered-crate
      - run: task install
      - run: task check-layers
